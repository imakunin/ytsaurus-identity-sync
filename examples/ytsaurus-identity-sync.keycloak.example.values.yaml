image:
  tag: "2024-04-19-569ba16"

yt:
  proxy: yt-proxy.acme.com
  # development configuration, use externalSecrets or sealedSecrets for production.
  token: "yt-secret-token"

syncSource: keycloak

keycloak:
  # development configuration, use externalSecrets or sealedSecrets for production.
  clientSecret: "keycloak-secret-token"
  # Optional CA bundle from existing Secret.
  # caRootBundle:
  #   kind: Secret
  #   name: keycloak-root-ca
  #   key: ca.crt

syncConfig: |-
  app:
    sync_interval: 10m
    username_replacements:
      - from: "@acme.com"
        to: ""
    remove_limit: 10
    ban_before_remove_duration: 168h # 7d

  keycloak:
    url: "http://localhost:8080"
    realm: "test_realm"
    client_id: "test_client"
    client_secret_env_var: "KEYCLOAK_CLIENT_SECRET"
    # Optional manual override. When keycloak.caRootBundle is set, chart sets this value automatically.
    # custom_root_ca: "/etc/ytsaurus-identity-sync/<keycloak.caRootBundle.key>"
    users_attribute_filter: "username:test_ email:@acme.com"
    users_group_filter: "^test_.*"
    groups_filter: "^test_.*"
    groups_root_path: "/" # optional: limits group discovery to this group subtree

  ytsaurus:
    proxy: "{{ .Values.yt.proxy }}"
    apply_user_changes: true
    apply_group_changes: true
    apply_member_changes: true
    timeout: 3s
    source_attribute_name: "keycloak"

  logging:
    is_production: true
    level: DEBUG
